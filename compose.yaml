name: reelflow
x-common: &common
  build: .
  image: reelflow:local
  env_file: .env
  user: "${PUID:-1000}:${PGID:-1000}"
  environment:
    DATA_DIR: /data
    FOOTAGE_DIR: /footage
  volumes:
    - ${DATA_PATH:-./data}:/data
    - ${FOOTAGE_PATH:-./footage}:/footage:ro
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  web:
    <<: *common
    ports:
      - "${LISTEN_HOST:-127.0.0.1}:${PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  worker:
    <<: *common
    command: ["python", "-m", "app.worker"]
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sqlite3,time; db=sqlite3.connect(os.environ['DATA_DIR']+'/reelflow.sqlite3'); row=db.execute(\"SELECT value FROM runtime WHERE key='heartbeat'\").fetchone(); assert row and time.time()-float(row[0])<2100"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
