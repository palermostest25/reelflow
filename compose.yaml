name: reelflow
services:
  reelflow:
    image: ghcr.io/palermostest25/reelflow:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    environment:
      PUBLIC_URL: "http://localhost:8080" # Set to your Cloudflare Tunnel's https:// address.
      META_APP_ID: ""
      META_APP_SECRET: ""
    volumes:
      - reelflow-data:/data
      - ./footage:/footage:ro # Replace ./footage with your TrueNAS folder.
volumes:
  reelflow-data:
