name: Test and publish Reelflow image
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reelflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: node --test tests/frontend.test.cjs

  image:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build native image on GitHub
        run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t reelflow:ci .
      - name: Test the single-container Compose file without application source
        run: |
          mkdir -p /tmp/reelflow-compose
          python3 - <<'PY'
          from pathlib import Path
          source = Path('compose.yaml').read_text()
          assert 'build:' not in source and 'healthcheck:' not in source and 'x-common' not in source
          Path('/tmp/reelflow-compose/compose.yaml').write_text(source.replace('ghcr.io/palermostest25/reelflow:latest', 'reelflow:ci'))
          PY
          cd /tmp/reelflow-compose
          docker compose config --quiet
          docker compose up -d --no-build --pull never
          test "$(docker compose config --services)" = reelflow
          docker compose exec -T reelflow python scripts/check_installation.py > /tmp/reelflow-first.txt
          docker compose restart reelflow
          docker compose exec -T reelflow python scripts/check_installation.py > /tmp/reelflow-second.txt
          cmp /tmp/reelflow-first.txt /tmp/reelflow-second.txt
      - name: Worker failure restarts the whole app
        working-directory: /tmp/reelflow-compose
        run: |
          container=$(docker compose ps -q reelflow)
          previous=$(docker inspect --format '{{.RestartCount}}' "$container")
          docker compose exec -T reelflow python - <<'PY'
          import os,signal
          from pathlib import Path
          workers=[]
          for process in Path('/proc').iterdir():
              if not process.name.isdigit():
                  continue
              try:
                  if b'app.worker' in (process/'cmdline').read_bytes().split(b'\0'):
                      workers.append(int(process.name))
              except (FileNotFoundError,PermissionError):
                  continue
          assert len(workers)==1,workers
          os.kill(workers[0],signal.SIGKILL)
          PY
          restarted=false
          for attempt in $(seq 1 60); do
            current=$(docker inspect --format '{{.RestartCount}}' "$container")
            if [ "$current" -gt "$previous" ]; then restarted=true; break; fi
            sleep .5
          done
          test "$restarted" = true
          for attempt in $(seq 1 30); do
            if docker compose exec -T reelflow python scripts/check_installation.py > /tmp/reelflow-recovered.txt; then break; fi
            sleep 1
          done
          cmp /tmp/reelflow-first.txt /tmp/reelflow-recovered.txt
      - name: Container diagnostics
        if: failure()
        working-directory: /tmp/reelflow-compose
        run: docker compose logs --no-color | sed -E 's/(admin password:).*/\1 [redacted]/'
      - name: Stop test container
        if: always()
        working-directory: /tmp/reelflow-compose
        run: docker compose down -v
      - name: Push tested architecture to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/palermostest25/reelflow:sha-${GITHUB_SHA}-${{ matrix.arch }}"
          docker tag reelflow:ci "$image"
          docker push "$image"

  publish:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish tested AMD64 and ARM64 image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image=ghcr.io/palermostest25/reelflow
          docker buildx imagetools create --tag "$image:latest" --tag "$image:sha-$GITHUB_SHA" "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$image:latest" --raw > /tmp/reelflow-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('/tmp/reelflow-manifest.json').read_text())
          platforms={(m['platform']['os'],m['platform']['architecture']) for m in manifest['manifests']}
          assert {('linux','amd64'),('linux','arm64')} <= platforms, platforms
          PY
          printf 'Published `%s:latest` and `%s:sha-%s` for AMD64 and ARM64.\n' "$image" "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
